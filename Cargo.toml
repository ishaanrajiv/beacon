[workspace]
resolver = "3"
members = ["crates/core", "crates/store", "crates/server", "crates/apns", "crates/codegen", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ishaanrajiv/beacon"

# The whole runtime dependency list. scripts/check fails if a crate uses anything else, and if any
# crate but beacon-apns uses reqwest, ring or base64: Beacon is meant to stay small, so a new
# dependency is a decision, not a convenience. There is no async runtime outside crates/apns
# (reqwest's blocking client carries its own, for HTTP/2 to Apple).
[workspace.dependencies]
beacon-core = { path = "crates/core" }
beacon-store = { path = "crates/store" }
beacon-server = { path = "crates/server" }
beacon-apns = { path = "crates/apns" }
beacon-codegen = { path = "crates/codegen" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
rusqlite = { version = "0.42", features = ["bundled"] }
ureq = { version = "3", default-features = false }
jiff = "0.2"
getrandom = "0.4"
lexopt = "0.3"
# crates/apns only:
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls"] }
ring = "0.17"
base64 = "0.22"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
